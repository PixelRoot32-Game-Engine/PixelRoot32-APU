; Listening harness for the three APU sound profiles.
;
; Audio plus a status panel: it plays three fixed pieces of increasing
; complexity through the real I2S backend while the serial console records what
; is playing, and repaints an ILI9341 panel once per block so the listener can
; see piece and profile from across the room. See README.md.
;
;   pio run -e esp32dev -t upload --upload-port COMx
;   pio device monitor --port COMx --baud 115200
;
; Standalone PlatformIO project, deliberately not part of the root CMake build.
; It consumes the APU from THIS working tree (`symlink://../..`) and the engine
; from the APU branch worktree, so the firmware can only ever describe these
; sources. `symlink://` in PlatformIO is not an OS symlink: it records the path
; in a `.pio-link` JSON and compiles the library in place. See
; tools/apu_bench_firmware/platformio.ini for why `file://../..` is not used.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../..
    symlink://C:/Users/Gperez/Documents/Projects/pr32-workspace/PixelRoot32-Game-Engine-worktrees/apu-profiles
    ; TFT_eSPI comes transitively from the engine, but the status screen uses it
    ; directly (no Renderer, no Scene, no engine input config), so it is declared
    ; explicitly with the same source the engine pins.
    TFT_eSPI=https://github.com/Gperez88/TFT_eSPI.git#master
; The APU library declares `-std=gnu++17`; Arduino's espressif32 default is
; gnu++11, and the last `-std` on the command line wins, so `-std=gnu++11` has
; to be removed rather than merely preceded.
build_unflags = -std=gnu++11
build_flags =
    -Os -std=gnu++17
    ; Panel configuration copied verbatim from the `pong` demo's
    ; `[env:esp32dev_ILI9341]`: an ILI9341 240x320 mounted in portrait and
    ; rotated a quarter turn to a 320x240 logical canvas. None of these pins
    ; collide with I2S (BCLK 5, LRCK 21, DOUT 19).
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D DISPLAY_ROTATION=3
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=16
    -D TFT_MISO=22
    -D TFT_MOSI=23
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=15
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; `USER_SETUP_LOADED` skips `User_Setup.h`, so the built-in fonts the status
    ; screen draws with have to be requested here or TFT_eSPI compiles them out:
    ; 1 = 8 px (labels), 2 = 16 px (block line), 4 = 26 px letters, scaled in
    ; software for the two big lines. Font 6 is deliberately NOT loaded: it only
    ; contains digits, ':', '-', '.', 'a', 'p', 'm', so `HYBRID` would render as
    ; blanks.
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4

[env:esp32dev]
board = esp32dev
