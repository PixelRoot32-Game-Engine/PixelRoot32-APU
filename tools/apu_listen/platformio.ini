; Listening harness for the three APU sound profiles.
;
; Audio only: instead of a game and a display it plays three fixed pieces of
; increasing complexity through the real I2S backend, while the serial console
; records what is playing. The speaker is the judge; the serial output is the
; transcript. See README.md.
;
;   pio run -e esp32dev -t upload --upload-port COMx
;   pio device monitor --port COMx --baud 115200
;
; Standalone PlatformIO project, deliberately not part of the root CMake build.
; It consumes the APU from THIS working tree (`symlink://../..`) and the engine
; from the APU branch worktree, so the firmware can only ever describe these
; sources. `symlink://` in PlatformIO is not an OS symlink: it records the path
; in a `.pio-link` JSON and compiles the library in place. See
; tools/apu_bench_firmware/platformio.ini for why `file://../..` is not used.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../..
    symlink://C:/Users/Gperez/Documents/Projects/pr32-workspace/PixelRoot32-Game-Engine-worktrees/apu-profiles
; The APU library declares `-std=gnu++17`; Arduino's espressif32 default is
; gnu++11, and the last `-std` on the command line wins, so `-std=gnu++11` has
; to be removed rather than merely preceded.
build_unflags = -std=gnu++11
build_flags = -Os -std=gnu++17

[env:esp32dev]
board = esp32dev
