; T8 / S11 -- firmware half of the APU render benchmark.
;
; Standalone PlatformIO project: it is deliberately not part of the root CMake
; build, and it consumes the library from THIS working tree (`symlink://../..`,
; i.e. the repo root) instead of the registry, so a recorded figure can never
; describe a different checkout than the one being measured.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; `symlink://../..` (the repo root) instead of the planned `file://../..`: this
; project lives INSIDE the library it benchmarks, and PlatformIO installs a
; `file://` dependency with `shutil.copytree` of the whole folder — which would
; copy the repository, `.git` included, into `.pio/libdeps/<env>/`, once per
; env and once more on every rebuild, taking this project's own `.pio` with it
; (the first attempt died on `Permission denied` for
; `tools/apu_bench_firmware/.pio/libdeps/esp32dev.lock`). `symlink://` in
; PlatformIO is not an OS symlink: it records the path in a `.pio-link` JSON and
; compiles the library in place, so the figures can only ever describe THIS
; working tree. See README.md, "Desviaciones".
lib_deps = symlink://../..
; `-std=gnu++17` is not decoration: Arduino's espressif32 default is gnu++11,
; and this library declares `-std=gnu++17` in its own `library.json` (C++14
; relaxed aggregate rules are what make `MusicNote{...}` compile at all).
; `-std=gnu++11` has to be removed, not just preceded: the last `-std` on the
; command line wins, and the framework's arrives after `build_flags`.
; `-Os` is kept, which is what makes this table comparable with the host tool.
build_flags = -Os -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32dev]
board = esp32dev

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
; This board is reached through the chip's native USB, and the Arduino core for
; `esp32-c3-devkitm-1` routes `Serial` to UART0 by default. Without this flag the
; matrix runs but nothing reaches the monitor.
;
; That native port has no reset line - the DevKitM-1's auto-reset bridge sits on
; the OTHER usb port - so a flash over it leaves the chip in the ROM bootloader
; and the application never runs. Boot it without an `EN` line, then attach:
;   esptool --port COM5 --before no_reset --after watchdog_reset read_mac
; Windows asserts DTR on enumeration, so a reader that opens late loses the
; identity line and the first cell; duplicate that cell if the row matters.
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
; Measured 2026-10-28 on an ESP32-S3-DevKitC-1 (QFN56, rev v0.2): this row cannot be
; filled from this machine yet, and the reason is the board, not the code.
;   * Native USB port (`303A:1001`): flashing succeeds and verifies, and an
;     `esptool flash_id --after hard_reset` resets the chip, but the application
;     produces no output there with `ARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1`
;     or with `ARDUINO_USB_MODE=0`, over 75 s captures with the reader attached
;     before and after the reset. The ROM prints on that channel; the sketch does not.
;   * UART port: the USB bridge does not enumerate at all on this unit - Windows
;     reports `Unknown USB Device (Device Descriptor Request Failed)`,
;     `VID_0000&PID_0002`, direct to the PC and with another cable. That is the port
;     the board's demo reads, which is why no flags are set here.
; To fill the row: a working UART bridge (or a USB-UART adapter on GPIO43/44), or a
; firmware that logs its results to flash so they can be read with `esptool read_flash`.
